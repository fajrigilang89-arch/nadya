<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BPMN Sistem Antrean Rumah Sakit</title>
<meta name="description" content="Diagram BPMN interaktif Sistem Antrean Rumah Sakit: pendaftaran, antrean, pemeriksaan, dan pelaporan.">
<meta property="og:title" content="BPMN Sistem Antrean Rumah Sakit">
<meta property="og:description" content="Diagram proses bisnis interaktif — zoom, geser, dan klik elemen untuk melihat alurnya.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A5%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#14201d; --muted:#5b6b66; --line:#d5dcd9;
  --accent:#0b6e5f; --accent-ink:#ffffff;
  --task-bg:#ffffff; --flow:#2b3a36; --pool-line:#14201d;
  --lane-pas:#dae8fc; --lane-pet:#fff2cc; --lane-dok:#e1d5e7; --lane-sis:#d5e8d4; --lane-dat:#eceeed; --lane-adm:#ffe6cc;
  --lane-head-alpha:.55; --end:#b3261e; --start:#2e7d32;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1514; --surface:#18211f; --ink:#e6eeeb; --muted:#9aaba5; --line:#2b3835;
    --accent:#4fd1b8; --accent-ink:#06211c;
    --task-bg:#1f2a28; --flow:#b9c7c2; --pool-line:#9aaba5;
    --lane-pas:#1c2b3f; --lane-pet:#3a3320; --lane-dok:#2f2538; --lane-sis:#1f3322; --lane-dat:#242b29; --lane-adm:#3b2c1c;
    --end:#ff8a80; --start:#7ddc82;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.05rem;font-weight:600;margin:0;letter-spacing:.005em}
header .sub{color:var(--muted);font-size:.82rem}
.spacer{flex:1}
.btn{font:inherit;font-size:.85rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[hidden]{display:none}
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;min-width:0;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
#stage.drag{cursor:grabbing}
svg#bpmn{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:38px;height:38px;justify-content:center;font-size:1.1rem;padding:0}
.zoom .fit{font-size:.7rem}
.hint{position:absolute;left:62px;bottom:20px;font-size:.78rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);
  padding:4px 10px;border-radius:999px;pointer-events:none}
aside{width:340px;max-width:42vw;background:var(--surface);border-left:1px solid var(--line);padding:18px 18px 24px;overflow:auto;font-size:.9rem;line-height:1.5}
aside h2{font-size:1rem;margin:0 0 4px;font-weight:600}
aside .kind{font-size:.78rem;color:var(--muted);margin:0 0 12px}
aside h3{font-size:.8rem;font-weight:600;color:var(--muted);margin:18px 0 6px}
aside .lane-tag{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:.8rem}
aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
aside li button{width:100%;text-align:left;font:inherit;font-size:.86rem;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;cursor:pointer}
aside li button:hover{border-color:var(--accent);background:rgba(11,110,95,.10)}
.chip{font-family:var(--mono);font-size:.72rem;color:var(--accent);margin-right:6px}
.legend{display:grid;grid-template-columns:34px 1fr;gap:8px 10px;align-items:center;margin-top:6px}
.legend svg{width:34px;height:24px;overflow:visible}
.lanes-list{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.lanes-list span{display:flex;align-items:center;gap:8px}
.lanes-list i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.clear{margin-top:16px}
footer{padding:7px 16px;font-size:.76rem;color:var(--muted);background:var(--surface);border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap}
footer a{color:var(--accent)}

/* ---------- SVG ---------- */
svg text{font-family:var(--font);fill:var(--ink)}
.pool{fill:var(--surface);stroke:var(--pool-line);stroke-width:1.5}
.pool-head{fill:var(--surface);stroke:var(--pool-line);stroke-width:1.5}
.pool-title{font-size:13px;font-weight:600}
.lane-bg{stroke:var(--pool-line);stroke-width:1}
.lane-head{stroke:var(--pool-line);stroke-width:1;fill-opacity:var(--lane-head-alpha)}
.lane-title{font-size:12px;font-weight:600}
.lane-pas .lane-bg,.lane-pas .lane-head{fill:var(--lane-pas)}
.lane-pet .lane-bg,.lane-pet .lane-head{fill:var(--lane-pet)}
.lane-dok .lane-bg,.lane-dok .lane-head{fill:var(--lane-dok)}
.lane-sis .lane-bg,.lane-sis .lane-head{fill:var(--lane-sis)}
.lane-dat .lane-bg,.lane-dat .lane-head{fill:var(--lane-dat)}
.lane-adm .lane-bg,.lane-adm .lane-head{fill:var(--lane-adm)}
.lane-bg{fill-opacity:.42}
.edge{fill:none;stroke:var(--flow);stroke-width:1.6;transition:opacity .15s}
.edge.assoc{stroke-dasharray:5 4;stroke-width:1.3}
.arrowhead{fill:var(--flow)} .arrowopen{fill:none;stroke:var(--flow);stroke-width:1.4}
.hit{display:none}
.node{cursor:pointer;transition:opacity .15s}
.node text{font-size:11.5px;pointer-events:none}
.node.task rect{fill:var(--task-bg);stroke:var(--accent);stroke-width:1.6}
.node.task:hover rect,.node.sel rect{stroke-width:3}
.ev-start circle{fill:var(--task-bg);stroke:var(--start);stroke-width:2}
.ev-end circle{fill:var(--task-bg);stroke:var(--end);stroke-width:4}
.node.event:hover circle,.node.sel circle{filter:drop-shadow(0 0 4px currentColor)}
.node.gw polygon{fill:var(--task-bg);stroke:var(--flow);stroke-width:1.6}
.node.gw .x{stroke:var(--flow);stroke-width:2.4;fill:none}
.node.gw:hover polygon,.node.sel polygon{stroke-width:3}
.node.ds path{fill:var(--task-bg);stroke:var(--flow);stroke-width:1.5}
.node.ds .rim{fill:none}
.node.ds:hover path,.node.sel path{stroke-width:2.6}
.node text.outside{font-size:11px;font-weight:500}
.elabel rect{fill:var(--surface);stroke:var(--line)}
.elabel text{font-size:10.5px;font-weight:600}
.elabel.assoc-l text{font-weight:400;font-style:italic;fill:var(--muted)}
svg.focus .node:not(.on){opacity:.28}
svg.focus .edge:not(.on){opacity:.1}
svg.focus .elabel{opacity:.35}
svg.focus .edge.on{stroke-width:2.6}

@media (max-width:760px){
  main{flex-direction:column}
  aside{width:100%;max-width:none;flex:0 0 auto;max-height:36%;border-left:0;border-top:1px solid var(--line);padding:14px 16px 18px}
  #stage{min-height:0}
  .zoom{bottom:auto;top:12px}
  .hint{display:none}
  header .sub{display:none}
  header{padding:8px 12px}
  header h1{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    $('#btnEdit').href = 'https://app.diagrams.net/#U' + encodeURIComponent(raw); $('#btnEdit').hidden = false;
    $('#repoInfo').innerHTML = `Sumber: <a href="https://github.com/${repo}" target="_blank" rel="noopener">github.com/${repo}</a>`;
  }

  /* ---------- pan & zoom ---------- */
  let s=1, tx=0, ty=0, cw=0, ch=0;
  const MIN=.12, MAX=3.5;
  function apply(){ svg.setAttribute('viewBox', `${tx} ${ty} ${cw/s} ${ch/s}`); }
  function measure(){ const r=stage.getBoundingClientRect(); cw=r.width; ch=r.height; }
  function fitHeight(){ measure(); s=Math.min(ch/H*0.98,1.2); tx=-8; ty=(H-ch/s)/2; apply(); }
  function fitAll(){ measure(); s=Math.min(cw/W,ch/H)*0.97; tx=(W-cw/s)/2; ty=(H-ch/s)/2; apply(); }
  function zoomAt(f,px,py){
    const n=Math.max(MIN,Math.min(MAX,s*f)); if(n===s) return;
    const wx=tx+px/s, wy=ty+py/s; s=n; tx=wx-px/s; ty=wy-py/s; apply();
  }
  const rel = e => { const r=stage.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  stage.addEventListener('wheel', e=>{ e.preventDefault(); const [x,y]=rel(e); zoomAt(Math.exp(-e.deltaY*0.0016),x,y); },{passive:false});
  $('#zin').onclick  = ()=>zoomAt(1.3,cw/2,ch/2);
  $('#zout').onclick = ()=>zoomAt(1/1.3,cw/2,ch/2);
  $('#zfit').onclick = fitAll;
  window.addEventListener('resize', ()=>{ const ocx=tx+cw/s/2, ocy=ty+ch/s/2; measure(); tx=ocx-cw/s/2; ty=ocy-ch/s/2; apply(); });

  const ptrs=new Map(); let moved=false, pinch0=null, startXY=null;
  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('.zoom')) return;
    ptrs.set(e.pointerId,[e.clientX,e.clientY]); moved=false; startXY=[e.clientX,e.clientY];
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s}; }
  });
  window.addEventListener('pointermove', e=>{
    if(!ptrs.has(e.pointerId)) return;
    const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===2 && pinch0){
      const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      const r=stage.getBoundingClientRect(); const mx=(a[0]+b[0])/2-r.left, my=(a[1]+b[1])/2-r.top;
      zoomAt((pinch0.s*d/pinch0.d)/s,mx,my); moved=true; return;
    }
    if(Math.hypot(e.clientX-startXY[0],e.clientY-startXY[1])>5) moved=true;
    if(moved){ stage.classList.add('drag'); tx-=(e.clientX-prev[0])/s; ty-=(e.clientY-prev[1])/s; apply(); }
  });
  const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; if(!ptrs.size) stage.classList.remove('drag'); };
  window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);

  /* ---------- seleksi elemen ---------- */
  const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function homePanel(){
    panel.innerHTML = `
      <h2>Alur pasien rawat jalan</h2>
      <p class="kind">Klik aktivitas, gateway, atau penyimpanan data untuk menyorot alurnya.</p>
      <h3>Simbol</h3>
      <div class="legend">
        <svg viewBox="0 0 34 24"><circle cx="17" cy="12" r="8" fill="none" stroke="var(--start)" stroke-width="2"/></svg><span>Peristiwa awal</span>
        <svg viewBox="0 0 34 24"><rect x="2" y="3" width="30" height="18" rx="5" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg><span>Aktivitas</span>
        <svg viewBox="0 0 34 24"><polygon points="17,2 29,12 17,22 5,12" fill="none" stroke="var(--flow)" stroke-width="1.6"/><path d="M13,8 L21,16 M21,8 L13,16" stroke="var(--flow)" stroke-width="2"/></svg><span>Gateway keputusan (Ya / Tidak)</span>
        <svg viewBox="0 0 34 24"><circle cx="17" cy="12" r="8" fill="none" stroke="var(--end)" stroke-width="4"/></svg><span>Peristiwa akhir</span>
        <svg viewBox="0 0 34 24"><path d="M5,6 a12,4 0 0 1 24,0 v12 a12,4 0 0 1 -24,0 z" fill="none" stroke="var(--flow)" stroke-width="1.5"/></svg><span>Penyimpanan data</span>
        <svg viewBox="0 0 34 24"><path d="M2,12 H32" stroke="var(--flow)" stroke-width="1.6"/></svg><span>Alur proses</span>
        <svg viewBox="0 0 34 24"><path d="M2,12 H32" stroke="var(--flow)" stroke-width="1.3" stroke-dasharray="5 4"/></svg><span>Akses data (baca / tulis)</span>
      </div>
      <h3>Jalur (swimlane)</h3>
      <div class="lanes-list">
        <span><i style="background:var(--lane-pas)"></i>Pasien</span>
        <span><i style="background:var(--lane-pet)"></i>Petugas Pendaftaran</span>
        <span><i style="background:var(--lane-dok)"></i>Dokter / Perawat</span>
        <span><i style="background:var(--lane-sis)"></i>Sistem Antrean RS</span>
        <span><i style="background:var(--lane-dat)"></i>Penyimpanan Data</span>
        <span><i style="background:var(--lane-adm)"></i>Admin Sistem</span>
      </div>`;
  }
  const rows = (list)=> list.length ? '<ul>'+list.map(x=>`<li><button data-go="${x.id}">${x.label?`<span class="chip">${esc(x.label)}</span>`:''}${esc(x.name)}</button></li>`).join('')+'</ul>' : '<p class="kind">—</p>';
  function select(id){
    const m = DATA.nodes[id]; if(!m) return;
    svg.classList.add('focus');
    svg.querySelectorAll('.node').forEach(n=>{ n.classList.toggle('sel',n.dataset.id===id); });
    const rel=new Set([id]); m.ins.forEach(x=>rel.add(x.id)); m.outs.forEach(x=>rel.add(x.id));
    svg.querySelectorAll('.node').forEach(n=>n.classList.toggle('on',rel.has(n.dataset.id)));
    svg.querySelectorAll('.edge').forEach(p=>p.classList.toggle('on',p.dataset.s===id||p.dataset.t===id));
    panel.innerHTML = `<h2>${esc(m.name)}</h2><p class="kind">${KIND[m.kind]}</p>
      <span class="lane-tag">${esc(m.lane)}</span>
      <h3>Datang dari</h3>${rows(m.ins)}
      <h3>Dilanjutkan ke</h3>${rows(m.outs)}
      <button class="btn clear" id="clr">Hapus sorotan</button>`;
    $('#clr').onclick=clear;
    // geser agar elemen terlihat
    let n; try{ n=svg.querySelector(`.node[data-id="${id}"]`).getBBox(); }catch(_){ return; }
    const px=(n.x+n.width/2-tx)*s, py=(n.y+n.height/2-ty)*s;
    if(px<60||px>cw-60||py<60||py>ch-60){ tx=n.x+n.width/2-cw/s/2; ty=n.y+n.height/2-ch/s/2; apply(); }
  }
  function clear(){ svg.classList.remove('focus'); svg.querySelectorAll('.sel,.on').forEach(n=>n.classList.remove('sel','on')); homePanel(); }
  stage.addEventListener('click', e=>{
    if(moved) return;
    const n=e.target.closest('.node'); if(n) select(n.dataset.id); else if(!e.target.closest('.zoom')) clear();
  });
  svg.querySelectorAll('.node').forEach(n=>n.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(n.dataset.id);} }));
  panel.addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b) select(b.dataset.go); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') clear(); });

  homePanel(); fitHeight();
}catch(err){
  console.error(err);
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:12px;bottom:12px;background:#fff3cd;color:#333;padding:8px 12px;border-radius:8px;font:13px sans-serif;z-index:9';
  d.textContent='Diagram tampil, tetapi fitur interaktif gagal dimuat: '+err.message; document.body.appendChild(d);
}
})();
</script>
</body>
</html>
